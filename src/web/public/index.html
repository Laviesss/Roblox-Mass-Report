<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMR | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background: #0f172a; color: #e2e8f0; }
        .stat-card { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 1.5rem; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-4px); border-color: #475569; }
        .status-online { color: #22c55e; }
        .status-busy { color: #f59e0b; }
        .log-stream { background: #020617; border-radius: 8px; border: 1px solid #1e293b; height: 300px; overflow-y: auto; padding: 1rem; font-size: 0.875rem; }
    </style>
</head>
<body class="p-8">
    <header class="mb-12 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-white tracking-tighter">RMR <span class="text-blue-500">SYSTEM</span> <span class="text-sm font-normal text-slate-500 ml-2">● Online</span></h1>
            <p class="text-slate-400">Roblox Mass Reporter</p>
        </div>
        <div class="flex gap-4">
            <div class="text-right">
                <p class="text-xs uppercase text-slate-500">Latency</p>
                <p class="font-bold text-blue-400" id="ping">-- ms</p>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
        <div class="stat-card">
            <p class="text-slate-500 text-xs uppercase mb-1">Fleet Strength</p>
            <p class="text-3xl font-bold" id="fleet_count">0</p>
        </div>
        <div class="stat-card">
            <p class="text-slate-500 text-xs uppercase mb-1">Target Queue</p>
            <p class="text-3xl font-bold" id="queue_count">0</p>
        </div>
        <div class="stat-card">
            <p class="text-slate-500 text-xs uppercase mb-1">Total Success</p>
            <p class="text-3xl font-bold text-green-500" id="success_count">0</p>
        </div>
        <div class="stat-card">
            <p class="text-slate-500 text-xs uppercase mb-1">Failed</p>
            <p class="text-3xl font-bold text-red-500" id="fail_count">0</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-white">Live Operations</h2>
            <div class="log-stream" id="logs">
                <div class="text-slate-600">[SYSTEM] Establishing link...</div>
            </div>
        </div>
        <div>
            <h2 class="text-xl font-bold mb-4 text-white">Identity Hub</h2>
            <div class="stat-card mb-4">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400">Proxies Active</span>
                    <span class="font-bold" id="proxy_count">0</span>
                </div>
                <div class="w-full bg-slate-800 h-1 mt-2 rounded-full overflow-hidden">
                    <div class="bg-blue-500 h-full" style="width: 0%" id="proxy_bar"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400">Unique Identities</span>
                    <span class="font-bold" id="ua_count">0</span>
                </div>
                <div class="w-full bg-slate-800 h-1 mt-2 rounded-full overflow-hidden">
                    <div class="bg-yellow-500 h-full" style="width: 0%" id="ua_bar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const logContainer = document.getElementById('logs');

        socket.on('stats_update', (stats) => {
            document.getElementById('fleet_count').innerText = stats.fleet;
            document.getElementById('queue_count').innerText = stats.queue;
            document.getElementById('success_count').innerText = stats.success;
            document.getElementById('fail_count').innerText = stats.fail;
            document.getElementById('proxy_count').innerText = stats.proxies;
            document.getElementById('ua_count').innerText = stats.uas;
        });

        socket.on('log', (msg) => {
            const div = document.createElement('div');
            div.className = 'mb-1 border-l-2 border-blue-900 pl-2 py-1';
            div.innerHTML = `<span class="text-slate-500">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logContainer.prepend(div);
            if (logContainer.children.length > 50) logContainer.lastChild.remove();
        });

        setInterval(() => {
            const start = Date.now();
            socket.emit('ping_check', () => {
                document.getElementById('ping').innerText = `${Date.now() - start} ms`;
            });
        }, 5000);
    </script>
</body>
</html>
